resources:
  jobs:
    citibike_daily:
      name: citibike_daily
      tasks:
        - task_key: ingest_bronze
          disabled: false
          email_notifications: {}
          notebook_task:
            notebook_path: ../src/ingest_bronze.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: transform_silver_gold
          depends_on:
            - task_key: ingest_bronze
          disabled: false
          email_notifications: {}
          pipeline_task:
            pipeline_id: ${resources.pipelines.citibike_pipeline.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      trigger:
        file_arrival:
          url: /Volumes/workspace/citibike/raw/trips/
        pause_status: UNPAUSED
      webhook_notifications: {}
